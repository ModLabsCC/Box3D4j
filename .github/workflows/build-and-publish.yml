name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0-1.0.0). Leave empty to publish SNAPSHOT."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    env:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/') && env.VERSION_OVERRIDE == ''
        run: echo "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Report publish version
        run: |
          if [ -n "${VERSION_OVERRIDE}" ]; then
            echo "Publishing release version: ${VERSION_OVERRIDE}"
          else
            echo "Publishing snapshot version: 0.1.0-1.0-SNAPSHOT"
          fi

      - name: Validate publishing secrets
        run: |
          if [ -z "${REPO_TOKEN}" ]; then
            echo "REPO_TOKEN secret is required for publishing."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and publish
        run: ./gradlew --no-daemon clean build publish
