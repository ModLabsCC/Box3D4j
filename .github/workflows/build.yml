name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macosx-arm64
          - os: macos-15-intel
            platform: macosx-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test native binding
        shell: bash
        run: ./gradlew clean test jar -PjavacppPlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-${{ matrix.platform }}
          path: build/libs/Box3D4j-*.jar
          if-no-files-found: error

  bundle:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge platform JARs
        shell: bash
        run: |
          mkdir universal
          for artifact in artifacts/*/*.jar; do
            (cd universal && jar xf "../${artifact}")
          done
          jar --create --file box3d4j-0.1.0-1.0.0-all.jar -C universal .
      - name: Verify universal JAR contents
        shell: bash
        run: |
          jar tf box3d4j-0.1.0-1.0.0-all.jar > entries.txt
          grep -Fx 'org/bytedeco/javacpp/Loader.class' entries.txt
          grep -Fx 'cc/modlabs/box3d/linux-x86_64/libjniBox3D.so' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-arm64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-x86_64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/windows-x86_64/jniBox3D.dll' entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-all
          path: box3d4j-0.1.0-1.0.0-all.jar
