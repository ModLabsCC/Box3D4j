name: Build and Publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0-1.0.2). Leave empty for the commit-based git version."
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.box3d.outputs.sha }}
      changed: ${{ steps.box3d.outputs.changed }}
      marker: ${{ steps.box3d.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
      - id: box3d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git ls-remote https://github.com/erincatto/box3d.git refs/heads/main | cut -f1)"
          project_version="$(sed -n 's/^box3d4jVersion=//p' gradle.properties)"
          marker="box3d-main-${project_version}-${sha}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${marker}" >/dev/null 2>&1; then
            changed=false
          else
            changed=true
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"

  native:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            bash: bash
          - os: macos-15
            platform: macosx-arm64
            bash: bash
          - os: macos-15-intel
            platform: macosx-x86_64
            bash: bash
          - os: windows-2022
            platform: windows-x86_64
            bash: C:/Program Files/Git/bin/bash.exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
      BOX3D_COMMIT: ${{ needs.upstream.outputs.sha }}
      BASH_EXECUTABLE: ${{ matrix.bash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and test native binding
        shell: bash
        run: ./gradlew clean test jar -PjavacppPlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-${{ matrix.platform }}
          path: build/libs/Box3D4j-*.jar
          if-no-files-found: error

  bundle:
    needs: [upstream, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
      BOX3D_COMMIT: ${{ needs.upstream.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge platform JARs
        shell: bash
        run: |
          mkdir universal
          for artifact in artifacts/*/*.jar; do
            (cd universal && jar xf "../${artifact}")
          done
          jar --create --file box3d4j-all.jar -C universal .
      - name: Verify universal JAR contents
        shell: bash
        run: |
          jar tf box3d4j-all.jar > entries.txt
          grep -Fx 'org/bytedeco/javacpp/Loader.class' entries.txt
          grep -Fx 'cc/modlabs/box3d/linux-x86_64/libjniBox3D.so' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-arm64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-x86_64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/windows-x86_64/jniBox3D.dll' entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-all
          path: box3d4j-all.jar
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Validate publishing secrets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && needs.upstream.outputs.changed == 'true') || github.event_name == 'schedule'
        run: |
          if [ -z "${REPO_TOKEN}" ]; then
            echo "REPO_TOKEN secret is required for publishing."
            exit 1
          fi
      - name: Publish universal JAR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && needs.upstream.outputs.changed == 'true') || github.event_name == 'schedule'
        run: >-
          ./gradlew --no-daemon publish
          -PpublicationJar="$PWD/box3d4j-all.jar"
      - name: Mark Box3D commit as published
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && needs.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOX3D_MARKER: ${{ needs.upstream.outputs.marker }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"
          -f ref="refs/tags/${BOX3D_MARKER}"
          -f sha="${GITHUB_SHA}"
