name: Build and Publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0-1.0.0). Leave empty to publish SNAPSHOT."
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macosx-arm64
          - os: macos-15-intel
            platform: macosx-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and test native binding
        shell: bash
        run: ./gradlew clean test jar -PjavacppPlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-${{ matrix.platform }}
          path: build/libs/Box3D4j-*.jar
          if-no-files-found: error

  bundle:
    needs: native
    runs-on: ubuntu-24.04
    env:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge platform JARs
        shell: bash
        run: |
          mkdir universal
          for artifact in artifacts/*/*.jar; do
            (cd universal && jar xf "../${artifact}")
          done
          jar --create --file box3d4j-all.jar -C universal .
      - name: Verify universal JAR contents
        shell: bash
        run: |
          jar tf box3d4j-all.jar > entries.txt
          grep -Fx 'org/bytedeco/javacpp/Loader.class' entries.txt
          grep -Fx 'cc/modlabs/box3d/linux-x86_64/libjniBox3D.so' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-arm64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/macosx-x86_64/libjniBox3D.dylib' entries.txt
          grep -Fx 'cc/modlabs/box3d/windows-x86_64/jniBox3D.dll' entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: box3d4j-all
          path: box3d4j-all.jar
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Validate publishing secrets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${REPO_TOKEN}" ]; then
            echo "REPO_TOKEN secret is required for publishing."
            exit 1
          fi
      - name: Publish universal JAR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: >-
          ./gradlew --no-daemon publish
          -PpublicationJar="$PWD/box3d4j-all.jar"
